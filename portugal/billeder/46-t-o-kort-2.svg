<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img"><title>Middelalderligt T-i-O-kort</title><desc>T-i-O-kort: verden som en cirkel omgivet af oceanet Oceanus og delt af et T af vand (Mare magnum, Tanais og Nilus) i Asia, Europa og Afrika, med Hierusalem i midten og Paradisus længst mod øst.</desc><style>
  .hav { font-family: 'Segoe UI', Arial, sans-serif; fill: #4c7ea5; font-style: italic; }
  .del { font-family: 'Segoe UI', Arial, sans-serif; fill: #5b4a3a; font-weight: 600; letter-spacing: 4px; }
  .sted { font-family: 'Segoe UI', Arial, sans-serif; fill: #26343c; }
  .kursiv { font-style: italic; }
