v" x="295" y="420" font-size="14" text-anchor="middle" transform="rotate(90 295 420)" letter-spacing="3">Nilus</text><text class="del" x="182" y="195" font-size="27" text-anchor="middle">Europa</text><text class="del" x="182" y="425" font-size="27" text-anchor="middle">Afrika</text><text class="del" x="412" y="248" font-size="30" text-anchor="middle">Asia</text><circle cx="319" cy="300" r="3.6" fill="#ffffff" stroke="#26343c" stroke-width="1.4"/><text class="sted" x="327" y="305" font-size="15" text-anchor="start">Hierusalem</text><text class="sted kursiv" x="502" y="302" font-size="15" text-anchor="middle" transform="rotate(90 502 302)" letter-spacing="2">Paradisus</text><text class="sted" x="319" y="104" font-size="14" text-anchor="start">Gog et Magog</text><rect x="0.5" y="0.5" width="599" height="599" fill="none" stroke="#b7c7d1" stroke-width="1"/></svg>